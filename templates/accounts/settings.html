{% extends "base.html" %}{% load i18n %}
{% block title %}{% translate "My account" %}{% endblock %}
{% block content %}
<div class="auth-box">
  <h1>{% translate "My account" %}</h1>
  <p class="muted">{{ user.email }}</p>
  <form method="post" class="card" novalidate>
    {% csrf_token %}
    {% include "_form_fields.html" %}
    <button type="submit" class="btn">{% translate "Save" %}</button>
  </form>
  <p><a href="{% url 'accounts:password_change' %}">{% translate "Change my password" %}</a></p>
</div>
{% endblock %}
