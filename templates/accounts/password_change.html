{% extends "base.html" %}{% load i18n %}
{% block title %}{% translate "Change my password" %}{% endblock %}
{% block content %}
<div class="auth-box">
  <h1>{% translate "Change my password" %}</h1>
  <form method="post" class="card" novalidate>
    {% csrf_token %}
    {% include "_form_fields.html" %}
    <button type="submit" class="btn">{% translate "Change password" %}</button>
  </form>
</div>
{% endblock %}
